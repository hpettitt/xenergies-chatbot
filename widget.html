<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conseiller Xenergies</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
  }

  /* ── Floating button ── */
  #chat-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2d6a4f, #1b4332);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 22px;
    box-shadow: 0 4px 20px rgba(45,106,79,0.5);
    z-index: 9999;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #chat-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 24px rgba(45,106,79,0.7);
  }

  /* Pulse ring on toggle */
  #chat-toggle::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(45,106,79,0.3);
    animation: pulse-ring 2s ease-out infinite;
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* ── Chat window ── */
  #chat-window {
    display: none;
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 380px;
    max-height: 580px;
    background: #0f172a;
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
    z-index: 9998;
    flex-direction: column;
    overflow: hidden;
    animation: slide-up 0.25s ease;
  }
  #chat-window.open { display: flex; }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Mobile: fullscreen */
  @media (max-width: 420px) {
    #chat-window {
      bottom: 0;
      right: 0;
      width: 100vw;
      max-height: 100dvh;
      border-radius: 0;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }
    #chat-toggle {
      bottom: 16px;
      right: 16px;
    }
  }

  /* ── Header ── */
  #chat-header {
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #chat-header .avatar {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    position: relative;
  }
  #chat-header .avatar .online-dot {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 10px;
    height: 10px;
    background: #4ade80;
    border: 2px solid #1b4332;
    border-radius: 50%;
  }
  #chat-header .info { margin-left: 10px; flex: 1; }
  #chat-header .info h3 {
    color: white;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  #chat-header .info p {
    color: rgba(216,243,220,0.85);
    font-size: 10px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #chat-header .info p::after {
    content: '● Live';
    color: #86efac;
    font-size: 9px;
    font-family: monospace;
  }
  .badge {
    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }
  #close-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    font-size: 18px;
    margin-left: 8px;
    line-height: 1;
    padding: 2px;
  }
  #close-btn:hover { color: white; }

  /* ── Messages ── */
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: rgba(15,23,42,0.5);
    min-height: 220px;
    max-height: 360px;
  }
  @media (max-width: 420px) {
    #chat-messages { max-height: calc(100dvh - 220px); }
  }

  /* Scrollbar */
  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .msg-row.user { flex-direction: row-reverse; }

  .bot-avatar {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #1e293b;
    border: 1px solid #334155;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #74c69d;
    margin-top: 2px;
  }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.55;
  }
  .bubble.bot {
    background: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    border-top-left-radius: 4px;
  }
  .bubble.user {
    background: #2d6a4f;
    color: white;
    border-top-right-radius: 4px;
  }
  .bubble a {
    color: #74c69d;
    font-weight: 600;
    text-decoration: none;
  }
  .bubble a:hover { text-decoration: underline; }
  .bubble.user a { color: #a7f3d0; }

  .timestamp {
    font-size: 9px;
    color: #475569;
    font-family: monospace;
    margin-top: 4px;
    padding: 0 2px;
  }
  .msg-row.user .timestamp { text-align: right; }

  /* Typing dots */
  .typing-dots {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #475569;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* ── Suggestions ── */
  #suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 16px 4px;
    background: #0f172a;
    flex-shrink: 0;
  }
  .suggestion {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 5px 11px;
    font-size: 11px;
    cursor: pointer;
    color: #74c69d;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .suggestion:hover {
    background: #2d6a4f;
    border-color: #2d6a4f;
    color: white;
  }

  /* ── Input area ── */
  #chat-input-area {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid #1e293b;
    background: #0f172a;
    flex-shrink: 0;
  }
  #chat-input {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 24px;
    padding: 9px 16px;
    font-size: 13px;
    color: #e2e8f0;
    outline: none;
    transition: border-color 0.2s;
  }
  #chat-input::placeholder { color: #475569; }
  #chat-input:focus { border-color: #40916c; }

  #chat-send {
    background: linear-gradient(135deg, #2d6a4f, #1b4332);
    color: white;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #chat-send:hover { opacity: 0.85; transform: scale(1.05); }
  #chat-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<button id="chat-toggle" title="Conseiller livres Xenergies">
  <span id="toggle-icon" style="font-size:28px;line-height:1;">🌿</span>
</button>

<div id="chat-window">
  <div id="chat-header">
    <div class="avatar" style="font-size:20px;">🌿<div class="online-dot"></div></div>
    <div class="info">
      <h3>Conseiller Xenergies</h3>
      <p>Huiles essentielles doTERRA</p>
    </div>
    <span class="badge">Xenergies IA</span>
    <button id="close-btn" title="Fermer">✕</button>
  </div>

  <div id="chat-messages"></div>

  <div id="suggestions">
    <button class="suggestion" onclick="sendSuggestion(this)">Anxiété &amp; stress</button>
    <button class="suggestion" onclick="sendSuggestion(this)">Débutant en huiles</button>
    <button class="suggestion" onclick="sendSuggestion(this)">Mon enfant a le TDAH</button>
    <button class="suggestion" onclick="sendSuggestion(this)">Cuisiner avec les huiles</button>
  </div>

  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="Votre message..." maxlength="300" />
    <button id="chat-send">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
  const API_URL = window.CHATBOT_API_URL || "http://localhost:5055";

  let history = [];
  let isOpen = false;
  let hasGreeted = false;

  const toggle = document.getElementById("chat-toggle");
  const win = document.getElementById("chat-window");
  const messages = document.getElementById("chat-messages");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send");
  const suggestions = document.getElementById("suggestions");
  const closeBtn = document.getElementById("close-btn");

  const CLOSED_ICON = document.getElementById("toggle-icon").outerHTML;

  function openChat() {
    isOpen = true;
    win.classList.add("open");
    toggle.innerHTML = "✕";
    toggle.style.fontSize = "20px";
    if (!hasGreeted) {
      addMessage("bot", "Bonjour ! Je suis votre conseiller livres Xenergies. 🌿\n\nDites-moi ce qui vous intéresse et je vous recommande le livre idéal parmi notre catalogue d'huiles essentielles doTERRA.");
      hasGreeted = true;
    }
    input.focus();
  }

  function closeChat() {
    isOpen = false;
    win.classList.remove("open");
    toggle.innerHTML = CLOSED_ICON;
    toggle.style.fontSize = "";
  }

  toggle.addEventListener("click", () => isOpen ? closeChat() : openChat());
  closeBtn.addEventListener("click", closeChat);

  function now() {
    return new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    if (role === "bot") {
      const avatar = document.createElement("div");
      avatar.className = "bot-avatar";
      avatar.textContent = "X";
      row.appendChild(avatar);
    }

    const col = document.createElement("div");
    col.style.display = "flex";
    col.style.flexDirection = "column";
    col.style.maxWidth = "82%";
    if (role === "user") col.style.alignItems = "flex-end";

    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    bubble.innerHTML = markdownToHtml(text);
    col.appendChild(bubble);

    const ts = document.createElement("div");
    ts.className = "timestamp";
    ts.textContent = now();
    col.appendChild(ts);

    row.appendChild(col);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typing-row";

    const avatar = document.createElement("div");
    avatar.className = "bot-avatar";
    avatar.textContent = "X";
    row.appendChild(avatar);

    const bubble = document.createElement("div");
    bubble.className = "bubble bot";
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing-row");
    if (t) t.remove();
  }

  function markdownToHtml(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g, "<br>");
  }

  async function send(message) {
    if (!message.trim()) return;
    suggestions.style.display = "none";
    addMessage("user", message);
    input.value = "";
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });
      const data = await res.json();
      removeTyping();
      if (data.error) {
        addMessage("bot", "Désolé, une erreur s'est produite. Veuillez réessayer.");
      } else {
        addMessage("bot", data.reply);
        history = data.history;
      }
    } catch (e) {
      removeTyping();
      addMessage("bot", "Impossible de se connecter. Veuillez réessayer dans un moment.");
    }
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener("click", () => send(input.value));
  input.addEventListener("keydown", e => { if (e.key === "Enter") send(input.value); });

  function sendSuggestion(btn) { send(btn.textContent); }
</script>
</body>
</html>
